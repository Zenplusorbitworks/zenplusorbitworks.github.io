<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZEN+ORBIT Works | Custom Creative &amp; Engineering Studio</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040508;
      --card: rgba(14, 17, 26, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --border-glow: rgba(255, 255, 255, 0.28);
      --zen: #00f0ff;      /* Engineering, Dev, UI/UX */
      --orbit: #ff2a5f;    /* 3D, Motion, AMVs, Manga */
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 18px 64px;
    }

    /* Top Compact Navigation */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 99px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      margin-bottom: 22px;
    }

    .brand-mini {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }

    .top-links {
      display: flex;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
    }

    .top-links a {
      color: var(--muted);
      text-decoration: none;
      transition: 0.2s;
    }

    .top-links a:hover {
      color: #fff;
    }

    /* Above-the-Fold Main Studio Panel */
    .hero-panel {
      background: linear-gradient(145deg, rgba(16, 20, 32, 0.88), rgba(8, 10, 16, 0.92));
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 32px 24px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .hero-top {
      text-align: center;
      margin-bottom: 26px;
    }

    .studio-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.6rem, 9vw, 5.2rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .zen-c {
      background: linear-gradient(135deg, #ffffff 25%, var(--zen) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .plus-c {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.75em;
    }

    .orbit-c {
      background: linear-gradient(135deg, #ffffff 25%, var(--orbit) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .works-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      letter-spacing: 7px;
      color: #ffffff;
      opacity: 0.9;
      margin-bottom: 14px;
    }

    .hero-sub {
      max-width: 680px;
      margin: 0 auto;
      font-size: 0.98rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    /* Primary Channels Grid (Immediately Visible) */
    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .channel-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: all 0.3s ease;
    }

    .channel-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-glow);
      background: rgba(255, 255, 255, 0.06);
    }

    .c-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      width: fit-content;
      margin-bottom: 12px;
    }

    .b-orbit {
      background: rgba(255, 42, 95, 0.15);
      color: var(--orbit);
      border: 1px solid rgba(255, 42, 95, 0.35);
    }

    .b-zen {
      background: rgba(0, 240, 255, 0.15);
      color: var(--zen);
      border: 1px solid rgba(0, 240, 255, 0.35);
    }

    .channel-card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .channel-card p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
      line-height: 1.45;
    }

    .btn-launch {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      width: fit-content;
    }

    .btn-orbit {
      background: var(--orbit);
      color: #fff;
    }

    .btn-zen {
      background: var(--zen);
      color: #040508;
    }

    /* Client-First Custom Portfolio Banner */
    .client-banner {
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.08), rgba(255, 42, 95, 0.08));
      border: 1px solid rgba(0, 240, 255, 0.28);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      backdrop-filter: blur(16px);
    }

    .client-copy {
      max-width: 640px;
    }

    .client-copy .tag-on-demand {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--zen);
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      display: block;
    }

    .client-copy h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.35rem;
      margin-bottom: 6px;
    }

    .client-copy p {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .btn-request {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 13px 22px;
      border-radius: 12px;
      background: #ffffff;
      color: #040508;
      text-decoration: none;
      white-space: nowrap;
      transition: 0.25s;
    }

    .btn-request:hover {
      background: var(--zen);
      transform: translateY(-2px);
    }

    /* Social Strip */
    .social-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 36px;
    }

    .social-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      transition: 0.25s;
      cursor: pointer;
    }

    .social-item:hover {
      border-color: var(--border-glow);
      transform: translateY(-2px);
    }

    .social-item strong {
      display: block;
      font-size: 0.95rem;
    }

    .social-item span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Studio Services (A to Z) */
    .sec-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sec-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .skill-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      transition: 0.25s;
    }

    .skill-box:hover {
      border-color: rgba(0, 240, 255, 0.35);
    }

    .skill-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--zen);
      margin-bottom: 8px;
    }

    .skill-box h3 {
      font-size: 1.05rem;
      margin-bottom: 6px;
    }

    .skill-box p {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.45;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: var(--zen);
      border: 1px solid var(--zen);
      padding: 10px 22px;
      border-radius: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
